name: catch_it
description: "Share with QR code or NFC"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  receive_sharing_intent: ^1.8.1
  video_player: ^2.14.1
  shared_preferences: ^2.5.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/onboarding.mp4
